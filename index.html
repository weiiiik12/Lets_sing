<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎤 勁舞音浪 - YouTube 唱歌節拍評分網頁</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #121212; color: #fff; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #1e1e2f; padding: 25px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        h1 { color: #ff007f; text-shadow: 0 0 10px #ff007f; margin-bottom: 5px; }
        .subtitle { color: #aaa; font-size: 0.95rem; margin-bottom: 20px; }
        
        /* 遊戲區域 */
        .game-panel { border: 2px solid #333; border-radius: 12px; padding: 15px; background: #0d0d15; margin-bottom: 20px; }
        #player-container { display: flex; justify-content: center; margin-bottom: 15px; border-radius: 8px; overflow: hidden; }
        
        /* 節拍軌道區 */
        .track-container { position: relative; height: 80px; background: #222; border-radius: 40px; overflow: hidden; border: 3px solid #ff007f; margin: 15px 0; }
        .target-line { position: absolute; left: 80%; top: 0; bottom: 0; width: 6px; background: #00ffff; box-shadow: 0 0 12px #00ffff; z-index: 5; }
        .beat-node { position: absolute; top: 15px; width: 50px; height: 50px; background: radial-gradient(circle, #ff007f, #b30059); border-radius: 50%; box-shadow: 0 0 15px #ff007f; z-index: 3; }
        
        /* 動態回饋與計分 */
        .score-board { display: flex; justify-content: space-around; font-size: 1.2rem; background: #282840; padding: 10px; border-radius: 8px; margin-bottom: 15px; }
        .judgment-text { height: 40px; font-size: 2rem; font-weight: bold; text-shadow: 0 0 10px; transition: transform 0.1s ease; }
        .perfect { color: #00ffcc; text-shadow: 0 0 12px #00ffcc; }
        .great { color: #ffcc00; text-shadow: 0 0 12px #ffcc00; }
        .miss { color: #ff3366; text-shadow: 0 0 12px #ff3366; }

        /* 按鈕風格 */
        button { background: linear-gradient(45deg, #ff007f, #7928ca); border: none; color: white; padding: 12px 24px; font-size: 1rem; font-weight: bold; border-radius: 25px; cursor: pointer; transition: 0.2s; margin: 5px; }
        button:hover { transform: scale(1.05); box-shadow: 0 0 15px rgba(255, 0, 127, 0.6); }

        /* 排行榜 */
        .leaderboard { background: #181824; padding: 15px; border-radius: 10px; margin-top: 20px; text-align: left; }
        .leaderboard h3 { margin-top: 0; color: #00ffff; }
        .leader-item { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #333; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎤 勁舞音浪 Rhythm Sing</h1>
    <div class="subtitle">跟著歌曲拍子大聲唱出來！抓準音符抵達藍線的瞬間開口！</div>

    <div class="game-panel">
        <div id="player-container">
            <div id="player"></div>
        </div>

        <div class="track-container">
            <div class="target-line"></div>
            <div id="beat-node" class="beat-node" style="display: none;"></div>
        </div>

        <div class="judgment-text" id="judgment">READY?</div>

        <div class="score-board">
            <div>得分：<span id="score" style="color:#00ffff; font-weight:bold;">0</span></div>
            <div>Combo：<span id="combo" style="color:#ff007f; font-weight:bold;">0</span></div>
        </div>

        <div>
            <button id="start-btn" onclick="startGame()">▶ 開唱並啟動評分</button>
        </div>
    </div>

    <!-- 排行榜面板 -->
    <div class="leaderboard">
        <h3>🏆 本機英雄榜榜單</h3>
        <div id="leaderboard-list">
            <div class="leader-item"><span>1. Winnie</span><span>1200 分</span></div>
        </div>
    </div>
</div>

<!-- 引入 YouTube IFrame API -->
<script src="https://www.youtube.com/iframe_api"></script>
<script>
    let player;
    let audioContext, analyser, microphone, dataArray;
    let score = 0, combo = 0;
    let isPlaying = false;
    let currentBeatIndex = 0;

    // 模擬歌曲的目標拍子時間軸（秒）
    const targetBeats = [3.0, 5.0, 7.0, 9.0, 11.0, 13.0, 15.0, 17.0, 19.0, 21.0];
    const trackWidth = 700; // 軌道寬度
    const hitPositionRatio = 0.8; // 判定線在 80% 位置

    function onYouTubeIframeAPIReady() {
        player = new YT.Player('player', {
            height: '200',
            width: '360',
            videoId: 'L_LUpnjgPso', // 預設測試歌曲 ID
            playerVars: { 'autoplay': 0, 'controls': 1 }
        });
    }

    async function initMicrophone() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            microphone = audioContext.createMediaStreamSource(stream);
            microphone.connect(analyser);
            analyser.fftSize = 256;
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            return true;
        } catch (err) {
            alert("請允許麥克風權限以進行唱歌節拍判定！");
            return false;
        }
    }

    async function startGame() {
        if (isPlaying) return;
        const micReady = await initMicrophone();
        if (!micReady) return;

        score = 0; combo = 0; currentBeatIndex = 0;
        document.getElementById("score").innerText = score;
        document.getElementById("combo").innerText = combo;

        player.seekTo(0);
        player.playVideo();
        isPlaying = true;

        requestAnimationFrame(gameLoop);
    }

    function gameLoop() {
        if (!isPlaying) return;

        const currentTime = player.getCurrentTime();
        
        // 音量偵測
        analyser.getByteFrequencyData(dataArray);
        let volume = dataArray.reduce((a, b) => a + b, 0) / dataArray.length;

        // 音符移動邏輯
        if (currentBeatIndex < targetBeats.length) {
            const targetTime = targetBeats[currentBeatIndex];
            const timeDiff = targetTime - currentTime;
            const node = document.getElementById("beat-node");

            // 顯示當前朝判定線移動的音符
            if (timeDiff <= 2.0 && timeDiff >= -0.5) {
                node.style.display = "block";
                // 估算音符 X 軸位置
                let progress = 1 - (timeDiff / 2.0);
                let currentLeft = progress * (trackWidth * hitPositionRatio);
                node.style.left = `${currentLeft}px`;

                // 玩家發聲判定（音量閥值 > 35 視為發聲）
                if (volume > 35 && Math.abs(timeDiff) <= 0.3) {
                    evaluateHit(Math.abs(timeDiff));
                    currentBeatIndex++;
                } else if (timeDiff < -0.3) {
                    // 錯過判定
                    showJudgment("MISS", "miss");
                    combo = 0;
                    document.getElementById("combo").innerText = combo;
                    currentBeatIndex++;
                }
            } else {
                node.style.display = "none";
            }
        } else {
            // 遊戲結束
            isPlaying = false;
            showJudgment("GAME CLEAR!", "perfect");
            saveScore(score);
        }

        if (isPlaying) requestAnimationFrame(gameLoop);
    }

    function evaluateHit(timeOffset) {
        let text = "", className = "", points = 0;
        if (timeOffset <= 0.1) {
            text = "PERFECT!!"; className = "perfect"; points = 100;
        } else if (timeOffset <= 0.25) {
            text = "GREAT!"; className = "great"; points = 70;
        } else {
            text = "GOOD"; className = "great"; points = 40;
        }

        combo++;
        score += points + (combo * 5);
        document.getElementById("score").innerText = score;
        document.getElementById("combo").innerText = combo;
        showJudgment(text, className);
    }

    function showJudgment(text, className) {
        const el = document.getElementById("judgment");
        el.innerText = text;
        el.className = `judgment-text ${className}`;
    }

    function saveScore(finalScore) {
        let name = prompt("遊戲結束！請輸入你的名字登錄排行榜：", "Winnie");
        if (!name) name = "無名歌王";
        
        let records = JSON.parse(localStorage.getItem("sing_leaderboard") || "[]");
        records.push({ name: name, score: finalScore });
        records.sort((a, b) => b.score - a.score);
        records = records.slice(0, 5); // 取 Top 5
        
        localStorage.setItem("sing_leaderboard", JSON.stringify(records));
        renderLeaderboard();
    }

    function renderLeaderboard() {
        let records = JSON.parse(localStorage.getItem("sing_leaderboard") || "[]");
        let html = "";
        records.forEach((r, idx) => {
            html += `<div class="leader-item"><span>${idx + 1}. ${r.name}</span><span>${r.score} 分</span></div>`;
        });
        if (records.length > 0) {
            document.getElementById("leaderboard-list").innerHTML = html;
        }
    }

    // 初始化渲染
    renderLeaderboard();
</script>
</body>
</html>
